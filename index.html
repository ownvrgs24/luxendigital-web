<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint: the stylesheet is fetched as
         a preload and applied once it arrives (display=swap covers the gap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="author" content="Luxen Digital" />
    <meta name="theme-color" content="#050507" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The LeadConnector chat widget pulls in ~4 MB (scripts, phone-number
         libraries, a video) and third-party cookies. It is injected on the
         visitor's first interaction, or after 15s, so none of that competes
         with the page's own first load. -->
    <script>
      (function () {
        var loaded = false;
        var events = ["pointerdown", "keydown", "scroll", "touchstart", "mousemove"];
        function load() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) {
            window.removeEventListener(e, load, { passive: true });
          });
          var s = document.createElement("script");
          s.src = "https://widgets.leadconnectorhq.com/loader.js";
          s.async = true;
          s.setAttribute(
            "data-resources-url",
            "https://widgets.leadconnectorhq.com/chat-widget/loader.js"
          );
          s.setAttribute("data-widget-id", "6a72016dd81ad928ff3389af");
          document.body.appendChild(s);
        }
        events.forEach(function (e) {
          window.addEventListener(e, load, { passive: true });
        });
        window.addEventListener("load", function () {
          setTimeout(load, 15000);
        });
      })();
    </script>
  </body>
</html>
